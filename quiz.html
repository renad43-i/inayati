<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>حددي روتينك | رينورا</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script><script src="js/engine.js"></script><script src="js/mock-api.js"></script><script src="js/packshots.js"></script><script src="js/app.js"></script>
</head>
<body>
<div style="background:#2F3B30;color:#FBF7F1;text-align:center;font-size:13px;padding:6px 16px">نسخة عرض تعمل داخل المتصفح · البيانات تنحفظ على جهازك فقط · الدفع تجريبي</div>
<main class="container">
  <div class="quiz-wrap">
    <div id="quiz" class="card">
      <div class="row small muted"><span id="stepLabel"></span><span class="spacer"></span><button class="link-btn" id="backBtn">رجوع</button></div>
      <div class="progress"><div id="bar" style="width:0"></div></div>
      <h2 id="qTitle"></h2>
      <p class="muted" id="qSub"></p>
      <div class="options" id="options"></div>
      <button class="btn block" id="nextBtn" disabled>التالي</button>
    </div>
    <div id="result" class="hidden"></div>
  </div>
</main>
<script>
App.layout("quiz");
const answers = {};
let steps = [], idx = 0;
const visible = () => Engine.QUIZ.filter(q => !q.when || q.when(answers));

function render() {
  steps = visible();
  if (idx >= steps.length) idx = steps.length - 1;
  const q = steps[idx];
  App.qs("#stepLabel").textContent = `سؤال ${idx + 1} من ${steps.length}`;
  App.qs("#bar").style.width = `${(idx / steps.length) * 100}%`;
  App.qs("#qTitle").textContent = q.title;
  App.qs("#qSub").textContent = q.sub || "اختاري كل اللي ينطبق";
  App.qs("#backBtn").classList.toggle("hidden", idx === 0);
  const cur = answers[q.id] || [];
  App.qs("#options").innerHTML = q.options.map(o => `<button class="option multi ${cur.includes(o.v) ? "active" : ""}" data-v="${o.v}" aria-pressed="${cur.includes(o.v)}">
      <span class="mark"></span><span><b>${o.t}</b>${o.d ? `<small>${o.d}</small>` : ""}</span></button>`).join("");
  App.qs("#nextBtn").disabled = !cur.length;
  App.qs("#nextBtn").textContent = idx === steps.length - 1 ? "اعرضي روتيني" : (cur.length ? `التالي (${cur.length})` : "التالي");
  App.qsa(".option").forEach(b => b.onclick = () => {
    const v = b.dataset.v, opt = q.options.find(o => o.v === v);
    let arr = answers[q.id] || [];
    if (opt.exclusive) arr = arr.includes(v) ? [] : [v];
    else { arr = arr.filter(x => !(q.options.find(o => o.v === x) || {}).exclusive); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; }
    answers[q.id] = arr; render();
  });
}
function next() {
  const q = steps[idx];
  if (!(answers[q.id] || []).length) return;
  steps = visible();
  if (idx < steps.length - 1) { idx++; render(); } else submit();
}
App.qs("#nextBtn").onclick = next;
App.qs("#backBtn").onclick = () => { if (idx > 0) { idx--; render(); } };

async function submit() {
  // ننظف إجابات الأسئلة اللي ما ظهرت (مثلاً لو غيرت المجال)
  const clean = {}; visible().forEach(q => clean[q.id] = answers[q.id]);
  App.qs("#nextBtn").disabled = true;
  const [res, cat, user] = await Promise.all([App.api("/api/recommend", { body: { answers: clean } }), App.catalog(), App.me()]);
  showResult(res, cat, user);
}

const SKIN_AR = { dry: "جافة", oily: "دهنية", combo: "مختلطة", normal: "عادية", sensitive: "حساسة" };
const HAIR_AR = { dry: "جاف", oily: "دهني", curly: "كيرلي", coily: "كِنكي", damaged: "تالف/مصبوغ", hairfall: "يتساقط", dandruff: "فيه قشرة", normal: "عادي" };
function showResult(res, cat, user) {
  App.qs("#quiz").classList.add("hidden");
  const box = App.qs("#result"); box.classList.remove("hidden");
  const subId = App.params.get("sub"), pr = res.profile || {};
  // «ابني روتينك»: كل أنواع المنتجات. لكل نوع: هل تبين تضيفينه؟ ووش المنتج اللي تختارينه؟
  const builders = res.kits.map(r => {
    const sec = cat.kMap[r.kitId].cat;
    const slots = Engine.routineSlots(r, sec, pr, cat.products, r.allergens || res.allergens)
      .map(s => ({ ...s, dismissed: [], chosen: s.candidates[0] }));
    return { r, sec, slots };
  });
  const MAX_ITEMS = 12, SHOWN = 3;
  const ids = b => b.slots.filter(s => s.included).map(s => s.chosen);
  // الخيارات الظاهرة: أول 3 ما شلتيها، ونحاول تكون من ماركات مختلفة
  const visibleOf = s => {
    const left = s.candidates.filter(id => !s.dismissed.includes(id)), out = [];
    for (const id of left) { if (out.length >= SHOWN) break; if (!out.some(x => cat.pMap[x].brand === cat.pMap[id].brand)) out.push(id); }
    for (const id of left) { if (out.length >= SHOWN) break; if (!out.includes(id)) out.push(id); }
    if (s.chosen && left.includes(s.chosen) && !out.includes(s.chosen)) out[out.length - 1] = s.chosen;
    return out;
  };
  const save = () => { try { sessionStorage.setItem("inayati_last_rec_v2", JSON.stringify({ res: { ...res, kits: builders.map(b => ({ ...b.r, productIds: ids(b) })) } })); } catch {} };
  const summary = [pr.skinTypes && pr.skinTypes.length ? "بشرة " + pr.skinTypes.map(t => SKIN_AR[t]).join(" و") : "",
    pr.hairTypes && pr.hairTypes.length ? "شعر " + pr.hairTypes.map(t => HAIR_AR[t]).join(" و") : "",
    pr.thickness && pr.thickness.length ? ({ fine: "خفيف", medium: "متوسط", thick: "كثيف" })[pr.thickness[0]] : "",
    pr.frizz && pr.frizz.length ? "يهيش" : "", pr.marks && pr.marks.length ? "آثار " + pr.marks.map(m => m.toUpperCase()).join(" و") : ""].filter(Boolean).join(" · ");

  const draw = () => {
    const prices = builders.map(b => ids(b).length ? Engine.kitPrice(ids(b), cat.pMap) : 0);
    const subPrices = builders.map(b => ids(b).length ? Engine.kitPrice(ids(b), cat.pMap, "subscription") : 0);
    const anyItems = builders.some(b => ids(b).length);
    box.innerHTML = `<div class="center" style="margin-bottom:22px"><span class="eyebrow">نتيجتك جاهزة</span><h1>ابني روتينك</h1>
      <p class="muted">${App.esc(summary)}</p>
      <p class="small">رشحنا لك من كل أنواع المنتجات، ولكل نوع ⭐ الأنسب لك. اختاري الأنواع اللي تبينها في روتينك، ولو ما عجبك منتج اضغطي ✕ ويطلع لك بديل.</p></div>
      ${builders.map((b, bi) => { const k = cat.kMap[b.r.kitId]; return `<div class="card" style="margin-bottom:16px;border-top:6px solid ${k.color}">
        <span class="tag sage">${App.TIER_AR[b.r.tier]}</span> <h2 style="margin:6px 0">${App.esc(k.name)}</h2>
        <p>${App.esc(b.r.why)}</p>
        ${b.r.swaps.length ? `<p class="small alert info" style="margin:0 0 10px">${b.r.swaps.map(s => s.to ? `استبدلنا «${App.esc(cat.pMap[s.from].name)}» بـ«${App.esc(cat.pMap[s.to].name)}» لأنه يحتوي على ${s.reason.map(a => Engine.REASON_AR[a]).join(" و")}.` : `حذفنا «${App.esc(cat.pMap[s.from].name)}» لعدم وجود بديل آمن.`).join("<br>")}</p>` : ""}
        <div class="builder">${b.slots.map((st, si) => { const vis = visibleOf(st), left = st.candidates.length - st.dismissed.length;
          return `<div class="b-step ${st.included ? "" : "off"}">
          <div class="b-head"><label class="b-inc"><input type="checkbox" data-inc="${bi}:${si}" ${st.included ? "checked" : ""}> <b>${App.esc(st.label)}</b></label>
            <span class="small muted">${st.included ? "في روتينك" : "اضغطي لإضافته"} · ${left} خيار</span></div>
          ${vis.length ? `<div class="b-opts">${vis.map(id => { const p = cat.pMap[id], on = st.included && st.chosen === id, top = id === st.candidates[0];
            return `<div class="b-cell"><button type="button" class="b-opt ${on ? "active" : ""}" data-b="${bi}" data-s="${si}" data-p="${p.id}" aria-pressed="${on}">
            ${top ? `<span class="b-star">⭐ ترشيحنا</span>` : ""}
            <span class="b-img">${App.productImg(p)}</span>
            <span class="brand-name" dir="ltr">${App.esc(p.brand)} ${(p.country || "").split(" ")[0]}</span>
            <span class="small b-name">${App.esc(p.name)}</span>
            <span class="small"><b>${App.fmt(p.price)}</b></span>
            <a class="small" href="product.html?id=${p.id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">التفاصيل</a></button>
            <button type="button" class="b-x" data-x="${bi}:${si}:${p.id}" aria-label="ما يعجبني، اعرضي بديل" title="ما يعجبني، اعرضي بديل">✕</button></div>`; }).join("")}</div>`
            : `<p class="small muted" style="margin:4px 0">خلصت الخيارات لهذا النوع.</p>`}
          ${st.dismissed.length ? `<button type="button" class="link-btn small" data-reset="${bi}:${si}">رجّعي الخيارات اللي شلتيها (${st.dismissed.length})</button>` : ""}
          </div>`; }).join("")}</div>
        <div class="row" style="margin-top:12px"><span class="small muted">${ids(b).length} منتجات</span><span class="price">${App.fmt(prices[bi])}</span><s class="muted small">${App.fmt(Engine.sumProducts(ids(b), cat.pMap))}</s><span class="spacer"></span>
          <a class="btn outline sm" href="kit.html?id=${k.id}&tier=${b.r.tier}&rec=${bi}">طريقة الاستخدام</a></div></div>`; }).join("")}
      <div style="margin-bottom:16px">${App.consultCTA(!!res.consult, res.consult ? res.consultWhy : "")}</div>
      ${res.notes.map(n => `<p class="alert info small">${App.esc(n)}</p>`).join("")}
      <div class="card"><div class="row"><div><b>المجموع</b><div class="muted small">أو ${App.fmt(subPrices.reduce((a, b) => a + b, 0))} شهرياً مع الاشتراك</div></div>
        <span class="spacer"></span><span class="price">${App.fmt(prices.reduce((a, b) => a + b, 0))}</span></div>
        <div class="row" style="margin-top:14px">
          ${subId ? `<button class="btn" id="applySub">طبّقي على اشتراكي #${App.esc(subId)}</button>` :
          `<button class="btn" id="addSub" ${anyItems ? "" : "disabled"}>اشتركي شهرياً (وفري 10%)</button><button class="btn outline" id="addOnce" ${anyItems ? "" : "disabled"}>شراء مرة واحدة</button>`}
          <button class="link-btn" onclick="location.href='quiz.html'">أعيدي الاختبار</button></div>
        ${user ? `<p class="small muted" style="margin:10px 0 0">حفظنا النتيجة في حسابك.</p>` : `<p class="small muted" style="margin:10px 0 0">سجلي دخولك عشان نحفظ نتيجتك ونقدر نجدد كيتك كل شهر.</p>`}</div>`;
    const count = () => builders.reduce((n, b) => n + ids(b).length, 0);
    const slot = v => { const [bi, si] = v.split(":").map(Number); return [builders[bi], builders[bi].slots[si]]; };
    const canAdd = b => { if (ids(b).length >= MAX_ITEMS) { App.toast(`الحد الأقصى ${MAX_ITEMS} منتج في الكيت الواحد`); return false; } return true; };
    App.qsa(".b-opt").forEach(el => el.onclick = () => { const b = builders[+el.dataset.b], st = b.slots[+el.dataset.s];
      if (!st.included) { if (!canAdd(b)) return; st.included = true; } st.chosen = el.dataset.p; save(); draw(); });
    App.qsa("[data-inc]").forEach(el => el.onchange = () => { const [b, st] = slot(el.dataset.inc);
      if (el.checked && !canAdd(b)) { el.checked = false; return; } st.included = el.checked;
      if (st.included && (!st.chosen || st.dismissed.includes(st.chosen))) st.chosen = visibleOf(st)[0];
      if (st.included && !st.chosen) st.included = false; save(); draw(); });
    App.qsa("[data-x]").forEach(el => el.onclick = () => { const [bi, si, pid] = el.dataset.x.split(":"); const [, st] = slot(bi + ":" + si);
      st.dismissed.push(pid); if (st.chosen === pid) { st.chosen = visibleOf(st)[0] || null; if (!st.chosen) st.included = false; }
      save(); draw(); App.toast("شلناه وطلع لك بديل"); });
    App.qsa("[data-reset]").forEach(el => el.onclick = () => { const [, st] = slot(el.dataset.reset); st.dismissed = []; if (!st.chosen) st.chosen = st.candidates[0]; save(); draw(); });
    const add = type => { builders.forEach(b => { if (ids(b).length) App.cart.add({ kitId: b.r.kitId, tier: b.r.tier, productIds: ids(b), purchaseType: type, qty: 1 }); }); location.href = "cart.html"; };
    if (subId) App.qs("#applySub").onclick = async () => {
      const b = builders.find(x => x.sec === (App.params.get("cat") === "hair" ? "hair" : "skin")) || builders[0];
      try { await App.api(`/api/subscriptions/${subId}`, { method: "PATCH", body: { action: "update", kitId: b.r.kitId, tier: b.r.tier, productIds: ids(b) } });
        location.href = "account.html#subs"; } catch (e) { App.toast(e.message); }
    };
    else { App.qs("#addSub").onclick = () => add("subscription"); App.qs("#addOnce").onclick = () => add("once"); }
  };
  save(); draw();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
// في حال إعادة الاختبار لتحديث اشتراك
if (App.params.get("cat")) answers.focus = [App.params.get("cat")];
render();
</script>
</body>
</html>
