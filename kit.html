<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>تفاصيل الكيت | عنايتي</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script><script src="js/engine.js"></script><script src="js/mock-api.js"></script><script src="js/packshots.js"></script><script src="js/app.js"></script>
</head>
<body>
<div style="background:#2F3B30;color:#FBF7F1;text-align:center;font-size:13px;padding:6px 16px">نسخة عرض تعمل داخل المتصفح · البيانات تنحفظ على جهازك فقط · الدفع تجريبي</div>
<main class="container">
  <p class="small muted" style="margin-top:20px"><a href="home.html">الرئيسية</a> / <a href="kits.html">الكيتات</a> / <span id="crumb"></span></p>
  <div class="product" id="product"></div>
  <section class="section" style="padding-top:0"><h2>كيتات ممكن تعجبك</h2><div class="kits-grid" id="related"></div></section>
</main>
<script>
App.layout("kits");
(async () => {
  const cat = await App.catalog();
  const kit = cat.kMap[App.params.get("id")];
  if (!kit) { App.qs("#product").innerHTML = `<p class="empty">الكيت غير موجود. <a href="kits.html">ارجعي للكيتات</a></p>`; return; }
  document.title = `${kit.name} | عنايتي`;
  App.qs("#crumb").textContent = kit.name;

  // لو جاية من نتيجة الاختبار نستخدم المنتجات المخصصة (بعد استبدال مسببات الحساسية)
  let custom = null;
  try {
    const rec = JSON.parse(sessionStorage.getItem("inayati_last_rec_v2"));
    const r = rec && rec.res.kits[+App.params.get("rec")];
    if (r && r.kitId === kit.id && Array.isArray(r.productIds) && r.productIds.every(id => cat.pMap[id] && cat.pMap[id].cat === kit.cat)) custom = r;
  } catch {}

  const state = { tier: (custom && custom.tier) || App.params.get("tier") || "full", type: "subscription", qty: 1, tab: "products" };
  const ids = () => (custom && custom.tier === state.tier) ? custom.productIds : kit.tiers[state.tier];

  function draw() {
    const pids = ids();
    const once = Engine.kitPrice(pids, cat.pMap, "once");
    const sub = Engine.kitPrice(pids, cat.pMap, "subscription");
    const orig = Engine.sumProducts(pids, cat.pMap);
    const r = kit.routine || {};
    const list = (arr) => arr && arr.length ? `<ol>${arr.map(s => `<li>${App.esc(s)}</li>`).join("")}</ol>` : `<p class="muted small">لا يوجد</p>`;
    App.qs("#product").innerHTML = `
      <div class="gallery" style="background:${kit.color}">${App.kitSVG(kit, pids)}</div>
      <div>
        <span class="tag sage">${App.esc(kit.for)}</span> <span class="tag">${[...new Set(pids.map(id => cat.pMap[id].country))].join(" · ")}</span>
        <h1 style="margin:8px 0 4px">${App.esc(kit.name)}</h1>
        <p class="muted">${App.esc(kit.tagline)}</p>
        ${custom && custom.tier === state.tier ? `<p class="alert ok small">هذا الكيت مخصص لك حسب نتيجة الاختبار${custom.swaps.length ? " (مع استبدال المكونات اللي تتحسسين منها)" : ""}.</p>` : ""}
        <div class="price" style="font-size:1.7rem">${App.fmt(state.type === "subscription" ? sub : once)} <s>${App.fmt(orig)}</s></div>
        <p class="small muted">شامل الضريبة · شحن مجاني فوق 200 ر.س</p>

        <label style="margin-top:14px">المستوى</label>
        <div class="tiers">${Engine.TIERS.map(t => `<button class="tier ${t === state.tier ? "active" : ""}" data-t="${t}"><b>${App.TIER_AR[t]}</b><span class="small muted">${kit.tiers[t].length} منتجات · ${App.fmt(Engine.kitPrice(kit.tiers[t], cat.pMap))}</span></button>`).join("")}</div>

        <div class="purchase">
          <label class="${state.type === "subscription" ? "active" : ""}"><input type="radio" name="pt" value="subscription" ${state.type === "subscription" ? "checked" : ""}>
            <span><b>اشتراك شهري — ${App.fmt(sub)}/شهر</b><br><span class="small muted">وفري 10% إضافية، يتجدد كل شهر، توقفينه أو تلغينه متى ما بغيتي</span></span></label>
          <label class="${state.type === "once" ? "active" : ""}"><input type="radio" name="pt" value="once" ${state.type === "once" ? "checked" : ""}>
            <span><b>شراء مرة واحدة — ${App.fmt(once)}</b></span></label>
        </div>
        <div class="row">
          <div class="qty"><button id="plus" aria-label="زيادة">+</button><span>${state.qty}</span><button id="minus" aria-label="نقص">−</button></div>
          <button class="btn" id="addBtn" style="flex:1">أضيفي للسلة</button>
        </div>

        <div class="tiktok-box">
          <svg width="34" viewBox="0 0 24 24" fill="#111" aria-hidden="true"><path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2-2.8V9a6.3 6.3 0 1 0 5.3 6.2V8.6a7.9 7.9 0 0 0 4.4 1.4V6.7a4.5 4.5 0 0 1-4.4-4.7z"/></svg>
          <div style="flex:1"><b>ريفيوهات حقيقية على تيك توك</b><div class="small muted">شوفي تجارب الناس مع منتجات هذا الكيت، ولكل منتج زر ريفيو خاص تحت</div></div>
          <a class="btn tiktok sm" href="${App.esc(App.ttHref(kit.tiktok || "https://www.tiktok.com/@inayati.sa"))}" target="_blank" rel="noopener">${App.tiktokIcon} شاهدي الريفيوهات</a>
        </div>

        <div class="card" style="margin-top:22px">
          <div class="tabs">
            <button data-tab="products" class="${state.tab === "products" ? "active" : ""}">محتوى الكيت</button>
            <button data-tab="routine" class="${state.tab === "routine" ? "active" : ""}">طريقة الاستخدام</button>
            <button data-tab="info" class="${state.tab === "info" ? "active" : ""}">معلومات</button>
          </div>
          <div class="${state.tab === "products" ? "" : "hidden"}"><ul class="prod-list">${pids.map(id => { const p = cat.pMap[id]; return `<li>
            <span class="prod-img">${App.productImg(p)}</span>
            <div style="flex:1;min-width:0"><div class="brand-name" dir="ltr">${App.esc(p.brand)}</div><b>${App.esc(p.name)}</b>
            <div class="small muted"><span dir="ltr">${App.esc(p.nameEn || "")}</span> · ${App.esc(p.size)} · ${App.STEP_AR[p.step] || p.step} · ${App.esc(p.country || "")}</div>
            <div class="small">${App.esc(p.desc)}</div>
            ${p.contains.length ? `<div class="small muted">يحتوي: ${p.contains.map(a => App.ALLERGEN_AR[a]).join("، ")}</div>` : `<div class="small" style="color:var(--ok)">خالٍ من العطور والكحول وزيوت المكسرات</div>`}
            ${App.suitabilityHTML(p)}
            <div class="row" style="margin-top:6px"><span class="small muted">قيمته منفرد ${App.fmt(p.price)}</span><span class="spacer"></span>
            ${p.tiktok ? `<a class="tt-link" href="${App.esc(App.ttHref(p.tiktok))}" target="_blank" rel="noopener">${App.tiktokIcon} ريفيوهات تيك توك</a>` : ""}</div></div></li>`; }).join("")}</ul></div>
          <div class="routine ${state.tab === "routine" ? "" : "hidden"}">
            ${kit.cat === "skin" ? `<h4>☀️ الصباح</h4>${list(r.morning)}<h4>🌙 المساء</h4>${list(r.evening)}` : (r.morning && r.morning.length ? `<h4>يومياً</h4>${list(r.morning)}` : "") + (r.evening && r.evening.length ? `<h4>المساء</h4>${list(r.evening)}` : "")}
            ${r.weekly && r.weekly.length ? `<h4>${kit.cat === "skin" ? "أسبوعياً ونصائح" : "روتين الغسيل الأسبوعي"}</h4>${list(r.weekly)}` : ""}
          </div>
          <div class="${state.tab === "info" ? "" : "hidden"} small">
            <p>• الكيت يكفي تقريباً لمدة شهر بالاستخدام اليومي.</p><p>• كل كيت يوصلك مع كرت مطبوع للروتين ورمز QR لفيديو الطريقة.</p>
            <p>• الاشتراك يتجدد تلقائياً كل شهر، وقبل التجديد تقدرين تعيدين الاختبار ونحدّث الكيت حسب احتياجك.</p><p>• إذا ظهر أي تهيج أوقفي الاستخدام واستشيري طبيبة الجلدية.</p>
            <p class="muted">• منتجات أصلية من موزعين معتمدين. معلومات المكونات والأسعار تقريبية لأغراض المشروع، والمرجع هو قائمة المكونات على العبوة.</p>
          </div>
        </div>
      </div>`;
    App.qsa(".tier").forEach(b => b.onclick = () => { state.tier = b.dataset.t; draw(); });
    App.qsa("input[name=pt]").forEach(i => i.onchange = () => { state.type = i.value; draw(); });
    App.qsa(".tabs button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; draw(); });
    App.qs("#plus").onclick = () => { state.qty = Math.min(10, state.qty + 1); draw(); };
    App.qs("#minus").onclick = () => { state.qty = Math.max(1, state.qty - 1); draw(); };
    App.qs("#addBtn").onclick = () => {
      App.cart.add({ kitId: kit.id, tier: state.tier, productIds: pids, purchaseType: state.type, qty: state.qty });
      App.toast("تمت الإضافة للسلة ✓");
    };
  }
  draw();
  App.qs("#related").innerHTML = cat.kits.filter(k => k.cat === kit.cat && k.id !== kit.id).slice(0, 4).map(k => App.kitCard(k, cat)).join("");
})();
</script>
</body>
</html>
